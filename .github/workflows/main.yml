name: Build biPaketimVar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android proje oluştur
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/bipaketimvar/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # Web uygulamasını APK içine de dahil et
          cp index.html app/src/main/assets/
          cp *.html app/src/main/assets/ || true
          cp *.css app/src/main/assets/ || true
          cp *.js app/src/main/assets/ || true
          find . -maxdepth 1 \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) -exec cp {} app/src/main/assets/ \; || true

          # Uygulama ikonu.
          # Öncelik: repo içindeki logo.png. Yoksa basit yerel ikon oluşturulur.
          if [ -f "logo.png" ]; then
            cp logo.png app/src/main/res/drawable/ic_launcher.png
          else
            cat > app/src/main/res/drawable/ic_launcher.xml <<'ICON_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#7B2CBF"
                  android:pathData="M0,0 L108,0 L108,108 L0,108 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,18 C39,18 27,30 27,45 C27,65 54,91 54,91 C54,91 81,65 81,45 C81,30 69,18 54,18 Z M54,36 C48,36 43,41 43,47 C43,53 48,58 54,58 C60,58 65,53 65,47 C65,41 60,36 54,36 Z" />
          </vector>
          ICON_EOF
          fi

          cat > settings.gradle <<'GRADLE_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "biPaketimVar"
          include ":app"
          GRADLE_EOF

          cat > build.gradle <<'GRADLE_EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          GRADLE_EOF

          cat > app/build.gradle <<'GRADLE_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.bipaketimvar.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.bipaketimvar.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          GRADLE_EOF

          cat > app/src/main/AndroidManifest.xml <<'MANIFEST_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- İnternet erişimi -->
              <uses-permission android:name="android.permission.INTERNET" />

              <!-- Android 13+ sistem bildirimleri için gerekli izin -->
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="biPaketimVar"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          MANIFEST_EOF

          cat > app/src/main/res/values/styles.xml <<'STYLE_EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#7B2CBF</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#7B2CBF</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          STYLE_EOF

          cat > app/src/main/java/com/bipaketimvar/app/MainActivity.java <<'JAVA_EOF'
          package com.bipaketimvar.app;

          import android.app.Activity;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  createNotificationChannel();

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl(
                      "https://bipaketimvar.github.io/biPaketimVar-/"
                  );
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          "paket_bildirimleri",
                          "Paket Bildirimleri",
                          NotificationManager.IMPORTANCE_HIGH
                      );

                      channel.setDescription(
                          "biPaketimVar yeni paket bildirimleri"
                      );
                      channel.enableVibration(true);

                      NotificationManager manager =
                          getSystemService(NotificationManager.class);

                      if (manager != null) {
                          manager.createNotificationChannel(channel);
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          JAVA_EOF

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: APK oluştur
        run: gradle assembleDebug

      - name: APK'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: biPaketimVar-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
