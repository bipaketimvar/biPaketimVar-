name: Build biPaketimVar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android proje oluştur
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/bipaketimvar/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # Web dosyalarını APK içine kopyala
          cp index.html app/src/main/assets/ 2>/dev/null || true
          cp *.html app/src/main/assets/ 2>/dev/null || true
          cp *.css app/src/main/assets/ 2>/dev/null || true
          cp *.js app/src/main/assets/ 2>/dev/null || true

          find . -maxdepth 1 \
            \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) \
            -exec cp {} app/src/main/assets/ \; || true

          # Uygulama ikonu
          if [ -f "logo.png" ]; then
            cp logo.png app/src/main/res/drawable/ic_launcher.png
          else
            cat > app/src/main/res/drawable/ic_launcher.xml <<'ICON_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#7B2CBF"
                  android:pathData="M0,0 L108,0 L108,108 L0,108 Z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,18 C39,18 27,30 27,45 C27,65 54,91 54,91 C54,91 81,65 81,45 C81,30 69,18 54,18 Z M54,36 C48,36 43,41 43,47 C43,53 48,58 54,58 C60,58 65,53 65,47 C65,41 60,36 54,36 Z" />

          </vector>
          ICON_EOF
          fi

          # settings.gradle
          cat > settings.gradle <<'GRADLE_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "biPaketimVar"
          include ":app"
          GRADLE_EOF

          # Root build.gradle
          cat > build.gradle <<'GRADLE_EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          GRADLE_EOF

          # app/build.gradle
          cat > app/build.gradle <<'GRADLE_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.bipaketimvar.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.bipaketimvar.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          GRADLE_EOF

          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml <<'MANIFEST_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <!-- Android 13+ bildirim izni -->
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="biPaketimVar"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          MANIFEST_EOF

          # Güvenli tema
          cat > app/src/main/res/values/styles.xml <<'STYLE_EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <!-- İçeriğin telefonun üst çubuğunun altından başlamasını sağlar -->
                  <item name="android:windowActionModeOverlay">true</item>

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">#7B2CBF</item>

                  <item name="android:statusBarColor">#7B2CBF</item>

                  <item name="android:navigationBarColor">#000000</item>

                  <item name="android:windowLightStatusBar">false</item>

                  <!-- Edge-to-edge kapalı -->
                  <item name="android:windowNoTitle">true</item>

              </style>

          </resources>
          STYLE_EOF

          # MainActivity.java
          cat > app/src/main/java/com/bipaketimvar/app/MainActivity.java <<'JAVA_EOF'
          package com.bipaketimvar.app;

          import android.Manifest;
          import android.app.Activity;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private WebView webView;

              private static final String CHANNEL_ID = "paket_bildirimleri";

              private static final int NOTIFICATION_PERMISSION_CODE = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  setupStatusBar();

                  createNotificationChannel();

                  webView = new WebView(this);

                  setContentView(webView);

                  setupWebView();

                  requestNotificationPermission();

                  webView.loadUrl(
                      "https://bipaketimvar.github.io/biPaketimVar-/"
                  );
              }


              /*
               * Telefonun üst kısmındaki saat/batarya alanı
               * uygulamanın üzerine binmesin.
               */
              private void setupStatusBar() {

                  Window window = getWindow();

                  if (window == null) {
                      return;
                  }

                  window.setStatusBarColor(
                      android.graphics.Color.rgb(123, 44, 191)
                  );

                  window.setNavigationBarColor(
                      android.graphics.Color.BLACK
                  );

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {

                      WindowInsetsController controller =
                          window.getInsetsController();

                      if (controller != null) {

                          controller.setSystemBarsAppearance(
                              0,
                              WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS
                          );
                      }
                  }
              }


              /*
               * WebView ayarları
               */
              private void setupWebView() {

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setMediaPlaybackRequiresUserGesture(false);

                  settings.setJavaScriptCanOpenWindowsAutomatically(true);

                  settings.setSupportMultipleWindows(false);

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public boolean shouldOverrideUrlLoading(
                          WebView view,
                          WebResourceRequest request
                      ) {

                          if (request == null) {
                              return false;
                          }

                          return handleUrl(
                              request.getUrl().toString()
                          );
                      }


                      @Override
                      public boolean shouldOverrideUrlLoading(
                          WebView view,
                          String url
                      ) {

                          return handleUrl(url);
                      }


                      @Override
                      public void onReceivedError(
                          WebView view,
                          WebResourceRequest request,
                          WebResourceError error
                      ) {

                          if (request != null && request.isForMainFrame()) {

                              Toast.makeText(
                                  MainActivity.this,
                                  "İnternet bağlantısı kontrol ediliyor...",
                                  Toast.LENGTH_SHORT
                              ).show();
                          }
                      }

                  });
              }


              /*
               * Telefon, WhatsApp, Google Maps ve diğer
               * Android bağlantılarını güvenli şekilde aç.
               */
              private boolean handleUrl(String url) {

                  if (url == null || url.trim().isEmpty()) {
                      return false;
                  }

                  try {

                      String lowerUrl = url.toLowerCase();

                      // Normal web sitesi
                      if (
                          lowerUrl.startsWith("http://") ||
                          lowerUrl.startsWith("https://")
                      ) {

                          return false;
                      }


                      // Telefon
                      if (
                          lowerUrl.startsWith("tel:") ||
                          lowerUrl.startsWith("telprompt:")
                      ) {

                          Intent intent = new Intent(
                              Intent.ACTION_DIAL,
                              Uri.parse(url)
                          );

                          startActivity(intent);

                          return true;
                      }


                      // WhatsApp
                      if (
                          lowerUrl.startsWith("whatsapp:") ||
                          lowerUrl.contains("wa.me")
                      ) {

                          Intent intent = new Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse(url)
                          );

                          startActivity(intent);

                          return true;
                      }


                      // SMS
                      if (
                          lowerUrl.startsWith("sms:")
                      ) {

                          Intent intent = new Intent(
                              Intent.ACTION_SENDTO,
                              Uri.parse(url)
                          );

                          startActivity(intent);

                          return true;
                      }


                      // E-posta
                      if (
                          lowerUrl.startsWith("mailto:")
                      ) {

                          Intent intent = new Intent(
                              Intent.ACTION_SENDTO,
                              Uri.parse(url)
                          );

                          startActivity(intent);

                          return true;
                      }


                      // Google Maps / harita
                      if (
                          lowerUrl.startsWith("geo:") ||
                          lowerUrl.startsWith("google.navigation:")
                      ) {

                          Intent intent = new Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse(url)
                          );

                          startActivity(intent);

                          return true;
                      }


                      // intent:// bağlantıları
                      if (
                          lowerUrl.startsWith("intent:")
                      ) {

                          try {

                              Intent intent =
                                  Intent.parseUri(
                                      url,
                                      Intent.URI_INTENT_SCHEME
                                  );

                              if (intent != null) {

                                  startActivity(intent);

                                  return true;
                              }

                          } catch (Exception ignored) {

                              return true;
                          }
                      }


                  } catch (ActivityNotFoundException e) {

                      Toast.makeText(
                          this,
                          "Bu bağlantıyı açacak uygulama bulunamadı.",
                          Toast.LENGTH_SHORT
                      ).show();

                      return true;

                  } catch (Exception e) {

                      Toast.makeText(
                          this,
                          "Bağlantı açılamadı.",
                          Toast.LENGTH_SHORT
                      ).show();

                      return true;
                  }

                  return true;
              }


              /*
               * Bildirim kanalı.
               * Android 8+ için gereklidir.
               */
              private void createNotificationChannel() {

                  if (Build.VERSION.SDK_INT <
                      Build.VERSION_CODES.O) {

                      return;
                  }

                  try {

                      NotificationManager manager =
                          getSystemService(
                              NotificationManager.class
                          );

                      if (manager == null) {
                          return;
                      }


                      NotificationChannel channel =
                          new NotificationChannel(
                              CHANNEL_ID,
                              "Paket Bildirimleri",
                              NotificationManager.IMPORTANCE_HIGH
                          );


                      channel.setDescription(
                          "Yeni paket ve sipariş bildirimleri"
                      );


                      channel.enableVibration(true);


                      channel.setShowBadge(true);


                      manager.createNotificationChannel(channel);

                  } catch (Exception ignored) {

                      // Bildirim kanalı oluşturulamazsa
                      // uygulamanın açılmasını engelleme.
                  }
              }


              /*
               * Android 13 ve üzeri için bildirim izni.
               *
               * İzin verilmezse uygulama çökmeyecek.
               */
              private void requestNotificationPermission() {

                  if (Build.VERSION.SDK_INT <
                      Build.VERSION_CODES.TIRAMISU) {

                      return;
                  }


                  try {

                      if (
                          checkSelfPermission(
                              Manifest.permission.POST_NOTIFICATIONS
                          )
                          != PackageManager.PERMISSION_GRANTED
                      ) {

                          requestPermissions(
                              new String[]{
                                  Manifest.permission.POST_NOTIFICATIONS
                              },
                              NOTIFICATION_PERMISSION_CODE
                          );
                      }

                  } catch (Exception ignored) {

                      // İzin penceresi açılamazsa
                      // uygulama kapanmayacak.
                  }
              }


              @Override
              public void onRequestPermissionsResult(
                  int requestCode,
                  String[] permissions,
                  int[] grantResults
              ) {

                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  );

                  if (
                      requestCode ==
                      NOTIFICATION_PERMISSION_CODE
                  ) {

                      // Kullanıcı izin vermese bile
                      // uygulama normal şekilde çalışmaya devam eder.
                  }
              }


              /*
               * Geri tuşu
               */
              @Override
              public void onBackPressed() {

                  if (
                      webView != null &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }


              /*
               * Activity kapanırken WebView'i temizle.
               */
              @Override
              protected void onDestroy() {

                  if (webView != null) {

                      webView.stopLoading();

                      webView.setWebViewClient(null);

                      webView.destroy();

                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          JAVA_EOF

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: APK oluştur
        run: gradle assembleDebug

      - name: APK'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: biPaketimVar-APK
          path: app/build/outputs/apk/debug/app-debug.apk
