name: Build biPaketimVar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android projesini oluştur
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/bipaketimvar/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

          # Web dosyalarını APK içine kopyala
          cp *.html app/src/main/assets/ 2>/dev/null || true
          cp *.css app/src/main/assets/ 2>/dev/null || true
          cp *.js app/src/main/assets/ 2>/dev/null || true

          find . -maxdepth 1 \
            \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) \
            -exec cp {} app/src/main/assets/ \; || true

          # --------------------------------------------------
          # SETTINGS
          # --------------------------------------------------

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "biPaketimVar"
          include ":app"
          EOF

          # --------------------------------------------------
          # ROOT BUILD
          # --------------------------------------------------

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          # --------------------------------------------------
          # APP BUILD
          # --------------------------------------------------

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.bipaketimvar.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.bipaketimvar.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          # --------------------------------------------------
          # MANIFEST
          # --------------------------------------------------

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="biPaketimVar"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # --------------------------------------------------
          # STYLE
          # --------------------------------------------------

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">
                      #7B2CBF
                  </item>

                  <item name="android:statusBarColor">
                      #7B2CBF
                  </item>

                  <item name="android:navigationBarColor">
                      #000000
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

              </style>

          </resources>
          EOF

          # --------------------------------------------------
          # ICON
          # --------------------------------------------------

          if [ -f "logo.png" ]; then

            cp logo.png \
              app/src/main/res/drawable/ic_launcher.png

          else

            cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <vector
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#7B2CBF"
                  android:pathData="
                  M0,0
                  L108,0
                  L108,108
                  L0,108
                  Z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="
                  M54,18
                  C39,18 27,30 27,45
                  C27,65 54,91 54,91
                  C54,91 81,65 81,45
                  C81,30 69,18 54,18
                  Z
                  M54,36
                  C48,36 43,41 43,47
                  C43,53 48,58 54,58
                  C60,58 65,53 65,47
                  C65,41 60,36 54,36
                  Z" />

          </vector>
          EOF

          fi

          # --------------------------------------------------
          # MAIN ACTIVITY
          # --------------------------------------------------

          cat > app/src/main/java/com/bipaketimvar/app/MainActivity.java <<'EOF'
          package com.bipaketimvar.app;

          import android.Manifest;
          import android.app.Activity;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              private static final String CHANNEL_ID =
                  "paket_bildirimleri";

              private static final int
                  NOTIFICATION_PERMISSION_CODE = 100;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  setContentView(webView);

                  setupWebView();

                  createNotificationChannel();

                  requestNotificationPermission();
              }

              private void setupWebView() {

                  WebSettings settings =
                      webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(
                      new WebViewClient() {

                          @Override
                          public boolean shouldOverrideUrlLoading(
                              WebView view,
                              String url
                          ) {

                              if (url == null) {
                                  return false;
                              }

                              if (
                                  url.startsWith("tel:") ||
                                  url.startsWith("sms:") ||
                                  url.startsWith("mailto:")
                              ) {

                                  try {

                                      Intent intent =
                                          new Intent(
                                              Intent.ACTION_VIEW,
                                              Uri.parse(url)
                                          );

                                      startActivity(intent);

                                  } catch (Exception ignored) {
                                  }

                                  return true;
                              }

                              if (
                                  url.startsWith("whatsapp:")
                              ) {

                                  try {

                                      Intent intent =
                                          new Intent(
                                              Intent.ACTION_VIEW,
                                              Uri.parse(url)
                                          );

                                      startActivity(intent);

                                  } catch (Exception ignored) {
                                  }

                                  return true;
                              }

                              if (
                                  url.startsWith("geo:")
                              ) {

                                  try {

                                      Intent intent =
                                          new Intent(
                                              Intent.ACTION_VIEW,
                                              Uri.parse(url)
                                          );

                                      startActivity(intent);

                                  } catch (Exception ignored) {
                                  }

                                  return true;
                              }

                              if (
                                  url.startsWith("intent:")
                              ) {

                                  try {

                                      Intent intent =
                                          Intent.parseUri(
                                              url,
                                              Intent.URI_INTENT_SCHEME
                                          );

                                      startActivity(intent);

                                  } catch (Exception ignored) {
                                  }

                                  return true;
                              }

                              return false;
                          }
                      }
                  );

                  webView.loadUrl(
                      "https://bipaketimvar.github.io/biPaketimVar-/"
                  );
              }

              private void createNotificationChannel() {

                  if (
                      Build.VERSION.SDK_INT <
                      Build.VERSION_CODES.O
                  ) {
                      return;
                  }

                  try {

                      NotificationManager manager =
                          getSystemService(
                              NotificationManager.class
                          );

                      if (manager == null) {
                          return;
                      }

                      NotificationChannel channel =
                          new NotificationChannel(
                              CHANNEL_ID,
                              "Paket Bildirimleri",
                              NotificationManager.IMPORTANCE_HIGH
                          );

                      channel.setDescription(
                          "Yeni paket bildirimleri"
                      );

                      channel.enableVibration(true);

                      channel.setShowBadge(true);

                      manager.createNotificationChannel(
                          channel
                      );

                  } catch (Exception ignored) {
                  }
              }

              private void requestNotificationPermission() {

                  if (
                      Build.VERSION.SDK_INT <
                      Build.VERSION_CODES.TIRAMISU
                  ) {
                      return;
                  }

                  try {

                      if (
                          checkSelfPermission(
                              Manifest.permission
                                  .POST_NOTIFICATIONS
                          ) != PackageManager.PERMISSION_GRANTED
                      ) {

                          requestPermissions(
                              new String[]{
                                  Manifest.permission
                                      .POST_NOTIFICATIONS
                              },
                              NOTIFICATION_PERMISSION_CODE
                          );
                      }

                  } catch (Exception ignored) {
                  }
              }

              @Override
              public void onBackPressed() {

                  if (
                      webView != null &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {

                  if (webView != null) {

                      webView.stopLoading();

                      webView.destroy();

                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

      # --------------------------------------------------
      # GRADLE
      # --------------------------------------------------

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: APK oluştur
        run: gradle assembleDebug

      # --------------------------------------------------
      # APK
      # --------------------------------------------------

      - name: APK'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: biPaketimVar-APK
          path: app/build/outputs/apk/debug/app-debug.apk
