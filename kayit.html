<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Paketimvar - Kayıt</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

body {
    min-height: 100vh;
    margin: 0;
}

.register-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
}

.register-container {
    width: 100%;
    max-width: 430px;
}

.register-logo {
    text-align: center;
    margin-bottom: 22px;
}

.register-logo img {
    max-width: 100%;
    height: auto;
}

.register-card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 18px;
    box-shadow:
        0 8px 30px rgba(15, 23, 42, .06);
}

.register-title {
    text-align: center;
    margin-bottom: 18px;
}

.register-title strong {
    display: block;
    font-size: 17px;
    color: #111827;
}

.register-title span {
    display: block;
    color: #6b7280;
    font-size: 11px;
    margin-top: 5px;
}

.form-group {
    margin-bottom: 13px;
}

.form-group label {
    display: block;
    color: #374151;
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 6px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 0 12px;
    font-size: 13px;
    outline: none;
    background: #ffffff;
    font-family: inherit;
}

.form-group input {
    min-height: 44px;
}

.form-group textarea {
    min-height: 80px;
    padding-top: 11px;
    padding-bottom: 11px;
    resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #2563eb;
    box-shadow:
        0 0 0 3px rgba(37, 99, 235, .08);
}

.register-button {
    width: 100%;
    min-height: 44px;
    border: 0;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
}

.register-button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.back-button {
    width: 100%;
    min-height: 42px;
    margin-top: 9px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
}

.message {
    display: none;
    margin-bottom: 12px;
    border-radius: 10px;
    padding: 10px;
    font-size: 11px;
    line-height: 1.4;
}

.message.show {
    display: block;
}

.message.error {
    background: #fee2e2;
    color: #991b1b;
}

.message.success {
    background: #dcfce7;
    color: #166534;
}

.info-box {
    background: #eff6ff;
    color: #1e40af;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 14px;
    font-size: 10px;
    line-height: 1.5;
}

</style>

</head>


<body>


<div class="register-page">

<div class="register-container">


<!-- =====================================================
     LOGO
===================================================== -->

<div class="register-logo">

<img
    src="ana.png"
    alt="Paketimvar"
>

</div>



<!-- =====================================================
     MESAJ
===================================================== -->

<div
    id="message"
    class="message"
></div>



<!-- =====================================================
     KAYIT KARTI
===================================================== -->

<div class="register-card">


<div class="register-title">

<strong id="kayitBaslik">
Hesap Oluştur
</strong>

<span id="kayitAciklama">
Bilgilerinizi girerek hesabınızı oluşturun.
</span>

</div>



<!-- =====================================================
     İŞLETME BİLGİSİ
===================================================== -->

<div
    id="isletmeBilgileri"
>


<div class="info-box">

🏪 İşletme hesabı oluşturuyorsunuz.
<br>
Paketlerin alınacağı adresi doğru girin.
Bu adres daha sonra paket oluşturma ekranında
otomatik olarak kullanılacaktır.

</div>


<!-- İŞLETME ADI -->

<div class="form-group">

<label for="isletmeAdi">
İşletme Adı
</label>

<input
    id="isletmeAdi"
    type="text"
    placeholder="Örn: İkra Tavuk Sote"
    autocomplete="organization"
>

</div>


<!-- ADRES -->

<div class="form-group">

<label for="adres">
İşletme Adresi
</label>

<textarea
    id="adres"
    placeholder="Paketlerin alınacağı açık adres"
    autocomplete="street-address"
></textarea>

</div>


</div>



<!-- =====================================================
     KURYE BİLGİSİ
===================================================== -->

<div
    id="kuryeBilgileri"
    style="display:none;"
>


<div class="info-box">

🚚 Kurye hesabı oluşturuyorsunuz.

</div>


<!-- KURYE ADI -->

<div class="form-group">

<label for="kuryeAdi">
Ad Soyad
</label>

<input
    id="kuryeAdi"
    type="text"
    placeholder="Adınız ve soyadınız"
    autocomplete="name"
>

</div>


</div>



<!-- =====================================================
     TELEFON
===================================================== -->

<div class="form-group">

<label for="telefon">
Telefon
</label>

<input
    id="telefon"
    type="tel"
    inputmode="tel"
    placeholder="05XX XXX XX XX"
    autocomplete="tel"
    maxlength="11"
>

</div>



<!-- =====================================================
     E-POSTA
===================================================== -->

<div class="form-group">

<label for="email">
E-posta
</label>

<input
    id="email"
    type="email"
    placeholder="ornek@mail.com"
    autocomplete="email"
    inputmode="email"
>

</div>



<!-- =====================================================
     ŞİFRE
===================================================== -->

<div class="form-group">

<label for="sifre">
Şifre
</label>

<input
    id="sifre"
    type="password"
    placeholder="En az 6 karakter"
    autocomplete="new-password"
>

</div>



<!-- =====================================================
     ŞİFRE TEKRAR
===================================================== -->

<div class="form-group">

<label for="sifreTekrar">
Şifre Tekrar
</label>

<input
    id="sifreTekrar"
    type="password"
    placeholder="Şifrenizi tekrar girin"
    autocomplete="new-password"
>

</div>



<!-- =====================================================
     KAYIT
===================================================== -->

<button
    id="kayitBtn"
    class="btn btn-primary register-button"
>
Hesap Oluştur
</button>



<!-- =====================================================
     GERİ
===================================================== -->

<button
    id="geriBtn"
    class="btn btn-light back-button"
>
← Giriş Sayfasına Dön
</button>


</div>


</div>

</div>



<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    auth,
    db
} from "./firebase.js";


import {
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    doc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* =====================================================
   URL'DEN TİPİ AL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


let tip =
    params.get("tip");


if (
    tip !== "kurye" &&
    tip !== "isletme"
) {

    tip =
        "isletme";

}



/* =====================================================
   ELEMENTLER
===================================================== */

const kayitBaslik =
    document.getElementById(
        "kayitBaslik"
    );


const kayitAciklama =
    document.getElementById(
        "kayitAciklama"
    );


const isletmeBilgileri =
    document.getElementById(
        "isletmeBilgileri"
    );


const kuryeBilgileri =
    document.getElementById(
        "kuryeBilgileri"
    );


const isletmeAdi =
    document.getElementById(
        "isletmeAdi"
    );


const kuryeAdi =
    document.getElementById(
        "kuryeAdi"
    );


const telefon =
    document.getElementById(
        "telefon"
    );


const email =
    document.getElementById(
        "email"
    );


const sifre =
    document.getElementById(
        "sifre"
    );


const sifreTekrar =
    document.getElementById(
        "sifreTekrar"
    );


const adres =
    document.getElementById(
        "adres"
    );


const kayitBtn =
    document.getElementById(
        "kayitBtn"
    );


const geriBtn =
    document.getElementById(
        "geriBtn"
    );


const message =
    document.getElementById(
        "message"
    );



/* =====================================================
   SAYFA TİPİNİ AYARLA
===================================================== */

if (
    tip === "kurye"
) {

    kayitBaslik.textContent =
        "Kurye Hesabı Oluştur";

    kayitAciklama.textContent =
        "Kurye bilgilerinizi girerek hesabınızı oluşturun.";

    isletmeBilgileri.style.display =
        "none";

    kuryeBilgileri.style.display =
        "block";

    kayitBtn.textContent =
        "🚚 Kurye Hesabı Oluştur";

}

else {

    kayitBaslik.textContent =
        "İşletme Hesabı Oluştur";

    kayitAciklama.textContent =
        "İşletme bilgilerinizi girerek hesabınızı oluşturun.";

    isletmeBilgileri.style.display =
        "block";

    kuryeBilgileri.style.display =
        "none";

    kayitBtn.textContent =
        "🏪 İşletme Hesabı Oluştur";

}



/* =====================================================
   MESAJ
===================================================== */

function mesaj(
    text,
    type = "error"
) {

    message.textContent =
        text;

    message.className =
        "message show " +
        type;

}



/* =====================================================
   TELEFON TEMİZLE
===================================================== */

function telefonTemizle(
    value
) {

    let temiz =
        String(value || "")
        .replace(
            /\D/g,
            ""
        );


    if (
        temiz.startsWith("90") &&
        temiz.length === 12
    ) {

        temiz =
            "0" +
            temiz.substring(2);

    }


    if (
        temiz.length === 10 &&
        temiz.startsWith("5")
    ) {

        temiz =
            "0" +
            temiz;

    }


    return temiz;

}



/* =====================================================
   TELEFON FORMAT
===================================================== */

telefon.addEventListener(
    "input",
    function() {

        let value =
            telefonTemizle(
                this.value
            );


        this.value =
            value.substring(
                0,
                11
            );

    }
);



/* =====================================================
   KAYIT
===================================================== */

async function kayitOl() {


    const tel =
        telefonTemizle(
            telefon.value
        );


    const mail =
        email.value
            .trim()
            .toLowerCase();


    const pass =
        sifre.value;


    const pass2 =
        sifreTekrar.value;



    /* =================================================
       İŞLETME
    ================================================= */

    let ad = "";

    let isletmeAdres = "";


    if (
        tip === "isletme"
    ) {

        ad =
            isletmeAdi.value.trim();


        isletmeAdres =
            adres.value.trim();


        if (!ad) {

            mesaj(
                "İşletme adını girin."
            );

            isletmeAdi.focus();

            return;

        }


        if (!isletmeAdres) {

            mesaj(
                "İşletme adresini girin."
            );

            adres.focus();

            return;

        }

    }



    /* =================================================
       KURYE
    ================================================= */

    if (
        tip === "kurye"
    ) {

        ad =
            kuryeAdi.value.trim();


        if (!ad) {

            mesaj(
                "Ad soyad bilgilerinizi girin."
            );

            kuryeAdi.focus();

            return;

        }

    }



    /* =================================================
       TELEFON
    ================================================= */

    if (
        tel.length !== 11 ||
        !tel.startsWith("05")
    ) {

        mesaj(
            "Geçerli bir telefon numarası girin."
        );

        telefon.focus();

        return;

    }



    /* =================================================
       E-POSTA
    ================================================= */

    if (!mail) {

        mesaj(
            "E-posta adresinizi girin."
        );

        email.focus();

        return;

    }


    if (
        !mail.includes("@") ||
        !mail.includes(".")
    ) {

        mesaj(
            "Geçerli bir e-posta adresi girin."
        );

        email.focus();

        return;

    }



    /* =================================================
       ŞİFRE
    ================================================= */

    if (!pass) {

        mesaj(
            "Şifre oluşturun."
        );

        sifre.focus();

        return;

    }


    if (
        pass.length < 6
    ) {

        mesaj(
            "Şifre en az 6 karakter olmalıdır."
        );

        sifre.focus();

        return;

    }


    if (
        pass !== pass2
    ) {

        mesaj(
            "Şifreler eşleşmiyor."
        );

        sifreTekrar.focus();

        return;

    }

    /* =================================================
       BUTON
    ================================================= */

    kayitBtn.disabled =
        true;

    kayitBtn.textContent =
        "Kayıt oluşturuluyor...";



    try {


        /* =================================================
           FIREBASE AUTH
        ================================================= */

        const sonuc =
            await createUserWithEmailAndPassword(
                auth,
                mail,
                pass
            );


        const uid =
            sonuc.user.uid;



        /* =================================================
           FIRESTORE VERİSİ
        ================================================= */

        const kullaniciData = {

            uid: uid,

            tip: tip,

            email: mail,

            telefon: tel,

            olusturmaTarihi:
                serverTimestamp()

        };



        /* =================================================
           İŞLETME VERİLERİ
        ================================================= */

        if (
            tip === "isletme"
        ) {

            kullaniciData.isletmeAdi =
                ad;

            kullaniciData.adres =
                isletmeAdres;

            /*
               Paket oluşturma ekranında
               kullanılabilmesi için ayrıca
               işletme adresini açık şekilde
               saklıyoruz.
            */

            kullaniciData.isletmeAdresi =
                isletmeAdres;

        }



        /* =================================================
           KURYE VERİLERİ
        ================================================= */

        if (
            tip === "kurye"
        ) {

            kullaniciData.adSoyad =
                ad;

            kullaniciData.kuryeAdi =
                ad;

        }



        /* =================================================
           FIRESTORE KAYIT
        ================================================= */

        await setDoc(
            doc(
                db,
                "kullanicilar",
                uid
            ),
            kullaniciData
        );



        /* =================================================
           BAŞARILI
        ================================================= */

        mesaj(
            "Hesabınız başarıyla oluşturuldu.",
            "success"
        );


        kayitBtn.textContent =
            "Kayıt Başarılı";


        /*
           İşletme veya kurye paneline gönder.
        */

        setTimeout(
            function() {

                if (
                    tip === "isletme"
                ) {

                    window.location.href =
                        "isletme.html";

                }

                else {

                    window.location.href =
                        "kurye.html";

                }

            },
            1200
        );

    }


    catch (error) {

        console.error(
            "Kayıt hatası:",
            error
        );


        let hata =
            "Kayıt sırasında bir hata oluştu.";


        if (
            error.code ===
            "auth/email-already-in-use"
        ) {

            hata =
                "Bu e-posta adresi zaten kayıtlı.";

        }


        else if (
            error.code ===
            "auth/invalid-email"
        ) {

            hata =
                "Geçerli bir e-posta adresi girin.";

        }


        else if (
            error.code ===
            "auth/weak-password"
        ) {

            hata =
                "Şifre çok zayıf. En az 6 karakter kullanın.";

        }


        else if (
            error.code ===
            "auth/network-request-failed"
        ) {

            hata =
                "İnternet bağlantınızı kontrol edin.";

        }


        else if (
            error.code ===
            "permission-denied"
        ) {

            hata =
                "Firebase erişim izni reddedildi. Firestore Rules kontrol edilmeli.";

        }


        mesaj(
            "❌ " + hata,
            "error"
        );


        kayitBtn.disabled =
            false;


        if (
            tip === "isletme"
        ) {

            kayitBtn.textContent =
                "🏪 İşletme Hesabı Oluştur";

        }

        else {

            kayitBtn.textContent =
                "🚚 Kurye Hesabı Oluştur";

        }

    }

}



/* =====================================================
   KAYIT BUTONU
===================================================== */

kayitBtn.addEventListener(
    "click",
    kayitOl
);



/* =====================================================
   ENTER
===================================================== */

sifreTekrar.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            kayitOl();

        }

    }
);



/* =====================================================
   GERİ
===================================================== */

geriBtn.addEventListener(
    "click",
    function() {

        window.location.href =
            "index.html";

    }
);



/* =====================================================
   SAYFA HAZIR
===================================================== */

console.log(
    "Paketimvar kayıt sistemi hazır.",
    "Tip:",
    tip
);


</script>

</body>

</html>
