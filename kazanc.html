<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paketimvar - Ödemeler ve Kazanç</title>
    
    <!-- Tailwind CSS ve FontAwesome CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --success-bg: #f0fdf4;
            --success-text: #16a34a;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            background-color: #f8fafc;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding-bottom: 96px;
        }

        /* Özet / Seçili Gün Kartı */
        .summary-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.04);
        }

        .date-navigator {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .total-earning-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .total-earning-value {
            font-size: 24px;
            font-weight: 900;
            color: var(--text-main);
            margin: 4px 0 12px 0;
        }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 12px;
        }

        .stat-box-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .stat-box-value {
            font-size: 13px;
            font-weight: 900;
            color: var(--text-main);
            margin-top: 2px;
        }

        /* Liste Öğeleri */
        .list-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.15s ease;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.02);
        }

        .list-card:active {
            background: #f1f5f9;
        }

        .section-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-main);
            margin: 16px 0 10px 0;
        }

        /* Daha Fazla Göster Butonu */
        .load-more-btn {
            display: block;
            width: 100%;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            color: var(--primary);
            cursor: pointer;
            margin-top: 16px;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.02);
        }

        .load-more-btn:active {
            background: var(--primary-light);
        }

        /* 4'lü Sabit Alt Navigasyon */
        .bottom-nav {
            position: fixed;
            bottom: 0; 
            left: 0; 
            right: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 4px;
            z-index: 1000;
            backdrop-filter: blur(10px);
            box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.06);
        }

        .nav-item {
            flex: 1;
            background: transparent; 
            border: none;
            border-radius: 12px;
            display: flex; 
            flex-direction: column; 
            align-items: center;
            font-size: 10px; 
            font-weight: 800; 
            color: var(--text-muted);
            cursor: pointer; 
            gap: 3px; 
            padding: 6px 4px;
        }

        .nav-item.active { 
            background: var(--primary-light);
            color: var(--primary); 
        }
        .nav-item .icon { font-size: 18px; }

        .empty-box { 
            text-align: center; 
            background: #fff; 
            border: 1px solid var(--border-color); 
            border-radius: 16px; 
            padding: 36px 18px; 
        }
    </style>
</head>

<body>

<!-- ================= ÜST BAR (HEADER) - KAZANÇ SAYFASI ================= -->
<header class="bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 flex justify-between items-center sticky top-0 z-50 h-14 shadow-sm">
    <!-- LOGO VEYA GERİ TUŞU VE SAYFA BAŞLIĞI -->
    <div class="flex items-center gap-3">
        <!-- Detay moduna geçildiğinde görünen GERİ BUTONU -->
        <button id="backViewBtn" type="button" class="hidden items-center gap-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold transition active:scale-95">
            <i class="fa-solid fa-arrow-left text-xs"></i>
            <span>Geri</span>
        </button>

        <!-- Standart Görünüm LOGO -->
        <a id="logoBox" href="kurye.html" class="flex items-center h-10 w-28 overflow-hidden">
            <img src="logo.png" alt="biPaketimVar" class="max-h-full w-auto object-contain mix-blend-multiply origin-left">
        </a>
        
        <span id="headerTitle" class="text-xs font-bold text-slate-400 border-l border-slate-200 pl-3">Kazanç</span>
    </div>

    <!-- SAĞ BUTONLAR -->
    <div class="flex items-center gap-2">
        <!-- BİLDİRİM BUTONU -->
        <button id="bildirimBtn" type="button" class="w-8 h-8 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center border border-amber-100 transition active:scale-95">
            <i class="fa-solid fa-bell text-xs"></i>
        </button>

        <!-- ÇIKIŞ BUTONU -->
        <button id="cikisBtn" type="button" class="flex items-center gap-1.5 bg-red-50 text-red-600 px-3 py-1.5 rounded-xl text-xs font-bold border border-red-100 transition active:scale-95">
            <i class="fa-solid fa-right-from-bracket text-xs"></i>
            <span>Çıkış</span>
        </button>
    </div>
</header>

<main style="padding:16px; max-width:480px; margin:0 auto;" id="mainContainer">
    <div class="empty-box">
        <div style="font-size:32px;">⏳</div>
        <div style="font-size:13px; font-weight:800; margin-top:8px;">Yükleniyor</div>
        <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">Tüm geçmiş siparişler taranıyor...</div>
    </div>
</main>

<!-- Sabit Alt Navigasyon -->
<nav class="bottom-nav">
    <button class="nav-item" id="homeBtn">
        <span class="icon">🏠</span> Ana Sayfa
    </button>
    <button class="nav-item" id="historyBtn">
        <span class="icon">📜</span> Geçmiş
    </button>
    <button class="nav-item active" id="earningsBtn">
        <span class="icon">💰</span> Kazanç
    </button>
    <button class="nav-item" id="profileBtn">
        <span class="icon">👤</span> Profil
    </button>
</nav>
<script type="module">
    import {
        auth,
        db,
        onAuthStateChanged,
        collection,
        query,
        where,
        getDocs,
        signOut
    } from "./firebase.js";

    let tumTeslimatlar = [];
    let gosterilenGunSayisi = 5;
    const mainContainer = document.getElementById("mainContainer");
    const headerTitle = document.getElementById("headerTitle");
    const backViewBtn = document.getElementById("backViewBtn");
    const logoBox = document.getElementById("logoBox");

    // Güvenli Buton Dinleyicileri
    document.addEventListener("DOMContentLoaded", () => {
        const cikisBtn = document.getElementById('cikisBtn');
        const bildirimBtn = document.getElementById('bildirimBtn');

        if (cikisBtn) {
            cikisBtn.addEventListener('click', async () => {
                await signOut(auth);
                window.location.href = "index.html";
            });
        }

        if (bildirimBtn) {
            bildirimBtn.addEventListener('click', () => {
                alert("Henüz yeni bildiriminiz bulunmuyor.");
            });
        }
    });

    onAuthStateChanged(auth, async function(user) {
        if (!user) {
            window.location.href = "index.html";
            return;
        }
        await verileriCek(user.uid);
    });

    async function verileriCek(kuryeUid) {
        try {
            const q = query(
                collection(db, "paketler"), 
                where("kuryeId", "==", kuryeUid)
            );

            const querySnapshot = await getDocs(q);
            tumTeslimatlar = [];

            querySnapshot.forEach((docItem) => {
                const data = docItem.data();
                if (data.durum === "teslim_edildi" || data.durum === "tamamlandi" || data.teslimTarihi) {
                    tumTeslimatlar.push({ id: docItem.id, ...data });
                }
            });

            anaListeyiGoster();

        } catch (error) {
            console.error("Veri çekme hatası:", error);
            mainContainer.innerHTML = `<div class="empty-box">Veriler yüklenirken hata oluştu: ${error.message}</div>`;
        }
    }

    // 1. AŞAMA: Günlere Göre Gruplanmış Geçmiş Aktivite Listesi
    window.anaListeyiGoster = function() {
        headerTitle.textContent = "Kazanç";
        backViewBtn.classList.add("hidden");
        backViewBtn.classList.remove("flex");
        logoBox.style.display = "flex";

        if (tumTeslimatlar.length === 0) {
            mainContainer.innerHTML = `
                <div class="empty-box">
                    <div style="font-size:32px;">💸</div>
                    <div style="font-size:13px; font-weight:800; margin-top:8px;">Henüz geçmiş aktivite yok</div>
                    <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">Sistemde kayıtlı teslimatınız bulunamadı.</div>
                </div>
            `;
            return;
        }

        let gunlerMap = {};
        tumTeslimatlar.forEach(p => {
            if (!p.teslimTarihi || !p.teslimTarihi.seconds) return;
            const date = new Date(p.teslimTarihi.seconds * 1000);
            const tarihStr = date.toLocaleDateString("tr-TR", { day: 'numeric', month: 'short', weekday: 'short' });
            
            let hamUcret = p.kuryeUcreti || p.ucret || "0";
            let sayisalDeger = parseFloat(String(hamUcret).replace(/[^0-9.]/g, "")) || 0;

            if (!gunlerMap[tarihStr]) {
                gunlerMap[tarihStr] = { toplamTutar: 0, adet: 0, hamTarih: date };
            }
            gunlerMap[tarihStr].toplamTutar += sayisalDeger;
            gunlerMap[tarihStr].adet += 1;
        });

        let siraliGunler = Object.keys(gunlerMap).sort((a, b) => {
            return gunlerMap[b].hamTarih - gunlerMap[a].hamTarih;
        });

        let html = `<div class="section-title">Geçmiş Aktivite</div>`;
        let gosterilecekler = siraliGunler.slice(0, gosterilenGunSayisi);

        gosterilecekler.forEach(gun => {
            let veri = gunlerMap[gun];
            html += `
                <div class="list-card" onclick="window.gunDetayGoster('${gun}')">
                    <div>
                        <div style="font-size:14px; font-weight:800; color:var(--text-main);">${gun}</div>
                        <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">${veri.adet} sipariş tamamlandı</div>
                    </div>
                    <div style="font-size:15px; font-weight:900; color:var(--success-text);">
                        ₺${veri.toplamTutar.toFixed(2)} &gt;
                    </div>
                </div>
            `;
        });

        if (gosterilenGunSayisi < siraliGunler.length) {
            html += `<button class="load-more-btn" onclick="window.dahaFazlaGoster()">Daha fazla göster</button>`;
        }

        mainContainer.innerHTML = html;
    }

    window.dahaFazlaGoster = function() {
        gosterilenGunSayisi += 5;
        anaListeyiGoster();
    }

    // 2. AŞAMA: Seçilen Günün Detayları ve Sipariş Listesi
    window.gunDetayGoster = function(tarihStr) {
        headerTitle.textContent = tarihStr;
        backViewBtn.classList.remove("hidden");
        backViewBtn.classList.add("flex");
        logoBox.style.display = "none";

        let oGununPaketleri = tumTeslimatlar.filter(p => {
            if (!p.teslimTarihi) return false;
            const date = new Date(p.teslimTarihi.seconds * 1000);
            const tStr = date.toLocaleDateString("tr-TR", { day: 'numeric', month: 'short', weekday: 'short' });
            return tStr === tarihStr;
        });

        let toplamGunKazanc = 0;
        oGununPaketleri.forEach(p => {
            let hamUcret = p.kuryeUcreti || p.ucret || "0";
            toplamGunKazanc += parseFloat(String(hamUcret).replace(/[^0-9.]/g, "")) || 0;
        });

        let detayHtml = `
            <div class="summary-card">
                <div class="date-navigator">
                    <span>${tarihStr}</span>
                </div>
                <div class="total-earning-title">Toplam kazanç</div>
                <div class="total-earning-value">₺${toplamGunKazanc.toFixed(2)}</div>
                
                <div class="stats-row">
                    <div class="stat-box">
                        <div class="stat-box-label">Sipariş Sayısı</div>
                        <div class="stat-box-value">${oGununPaketleri.length} Adet</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-box-label">Ortalama / Sipariş</div>
                        <div class="stat-box-value">₺${oGununPaketleri.length > 0 ? (toplamGunKazanc / oGununPaketleri.length).toFixed(2) : "0.00"}</div>
                    </div>
                </div>
            </div>

            <div class="section-title">Teslimatlar (${oGununPaketleri.length})</div>
        `;

        oGununPaketleri.forEach(p => {
            const isletmeAdi = p.isletmeAdi || p.paketAciklama || "İşletme";
            const hamUcret = p.kuryeUcreti || p.ucret || "0 ₺";
            let saatStr = "";
            if (p.teslimTarihi) {
                const d = new Date(p.teslimTarihi.seconds * 1000);
                saatStr = d.toLocaleTimeString("tr-TR", { hour: '2-digit', minute: '2-digit' });
            }

            detayHtml += `
                <div class="list-card" style="cursor:default;">
                    <div>
                        <div style="font-size:13px; font-weight:800; color:var(--text-main);">📦 ${escapeHtml(isletmeAdi)}</div>
                        <div style="font-size:11px; color:var(--text-muted); margin-top:3px;">🕒 ${saatStr} • <span style="color:var(--success-text); font-weight:700;">Tamamlandı</span></div>
                    </div>
                    <div style="font-size:14px; font-weight:900; color:var(--success-text);">
                        ₺${escapeHtml(String(hamUcret).replace("₺", "").trim())}
                    </div>
                </div>
            `;
        });

        mainContainer.innerHTML = detayHtml;
    }

    backViewBtn.onclick = () => {
        window.anaListeyiGoster();
    };

    // Alt Navigasyon Yönlendirmeleri
    const homeBtn = document.getElementById("homeBtn");
    const historyBtn = document.getElementById("historyBtn");
    const earningsBtn = document.getElementById("earningsBtn");
    const profileBtn = document.getElementById("profileBtn");

    if (homeBtn) homeBtn.onclick = () => window.location.href = "kurye.html";
    if (historyBtn) historyBtn.onclick = () => window.location.href = "gecmis.html";
    if (earningsBtn) earningsBtn.onclick = () => window.location.href = "kazanc.html";
    if (profileBtn) profileBtn.onclick = () => window.location.href = "profil.html";

    function escapeHtml(value) {
        return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
