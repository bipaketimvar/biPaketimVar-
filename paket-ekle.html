<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paketimvar - Yeni Paket Oluştur</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between pb-24">

    <!-- BİLDİRİM / ALERT TOAST -->
    <div id="toast" class="fixed top-5 right-5 left-5 max-w-sm mx-auto z-50 transform -translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <div id="toastContent" class="flex items-center gap-3 p-4 rounded-2xl shadow-xl border text-sm font-semibold">
            <i id="toastIcon" class="text-lg"></i>
            <span id="toastMessage"></span>
        </div>
    </div>

    <!-- ÜST BAR -->
    <header class="bg-white/95 backdrop-blur-md border-b border-slate-200/80 px-4 flex justify-between items-center sticky top-0 z-40 h-14 shadow-sm">
        <div class="flex items-center gap-3 h-full">
            <button onclick="goBack()" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition active:scale-95 shrink-0 border border-slate-200/50">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </button>
            <a href="isletme.html" class="flex items-center h-full">
                <img src="logo.png" alt="biPaketimVar" class="h-10 w-auto object-contain mix-blend-multiply scale-125 origin-left">
            </a>
        </div>
        <span class="text-[11px] font-extrabold bg-blue-50 text-blue-600 border border-blue-100/80 px-3 py-1.5 rounded-xl shrink-0 shadow-2xs">
            Yeni Paket
        </span>
    </header>


    <!-- ANA İÇERİK -->
    <main class="max-w-2xl w-full mx-auto p-4 space-y-4">

        <!-- BAŞLIK -->
        <div>
            <h1 class="text-xl font-black text-slate-900">Yeni Paket Oluştur</h1>
            <p class="text-xs text-slate-500 mt-0.5">Kurye için yeni teslimat kaydı oluşturun.</p>
        </div>

        <!-- FORM CONTAINER -->
        <form id="paketForm" onsubmit="paketKaydet(event)" class="space-y-4">

            <!-- 1. İŞLETME BİLGİSİ KARTI -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center border-b border-slate-100 pb-2.5 mb-3">
                    <h3 class="font-bold text-xs uppercase tracking-wider text-slate-600 flex items-center gap-2">
                        <i class="fa-solid fa-store text-blue-600"></i> İşletme Bilgisi
                    </h3>
                    <span id="isletmeDurum" class="text-[10px] font-bold bg-amber-50 text-amber-600 px-2 py-0.5 rounded-md">Yükleniyor...</span>
                </div>
                
                <div class="space-y-2 text-xs">
                    <div>
                        <span class="text-slate-400 block text-[11px]">İşletme Adı</span>
                        <div id="isletmeAdi" class="font-bold text-slate-800 text-sm mt-0.5">-</div>
                    </div>
                    <div>
                        <span class="text-slate-400 block text-[11px]">Alış Adresi</span>
                        <div id="isletmeAdresi" class="font-medium text-slate-600 mt-0.5 text-xs leading-relaxed">-</div>
                    </div>
                </div>
            </div>

            <!-- 2. MÜŞTERİ BİLGİLERİ KARTI -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                <h3 class="font-bold text-xs uppercase tracking-wider text-slate-600 flex items-center gap-2 border-b border-slate-100 pb-2.5">
                    <i class="fa-solid fa-user text-blue-600"></i> Müşteri Bilgileri
                </h3>

                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Müşteri Adı Soyadı <span class="text-red-500">*</span></label>
                        <input type="text" id="musteriAd" required placeholder="Örn: Ahmet Yılmaz" class="w-full bg-slate-50 border border-slate-200 focus:border-blue-600 focus:bg-white focus:outline-none rounded-xl p-3 text-xs font-medium text-slate-800 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Müşteri Telefonu <span class="text-red-500">*</span></label>
                        <input type="tel" id="musteriTel" required placeholder="05XXXXXXXXX" class="w-full bg-slate-50 border border-slate-200 focus:border-blue-600 focus:bg-white focus:outline-none rounded-xl p-3 text-xs font-medium text-slate-800 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Teslimat Adresi <span class="text-red-500">*</span></label>
                        <textarea id="musteriAdres" required rows="2" placeholder="Mahalle, sokak, bina no, daire no..." class="w-full bg-slate-50 border border-slate-200 focus:border-blue-600 focus:bg-white focus:outline-none rounded-xl p-3 text-xs font-medium text-slate-800 transition"></textarea>
                    </div>
                </div>
            </div>
            <!-- 3. PAKET BİLGİLERİ KARTI -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                <h3 class="font-bold text-xs uppercase tracking-wider text-slate-600 flex items-center gap-2 border-b border-slate-100 pb-2.5">
                    <i class="fa-solid fa-box text-blue-600"></i> Paket Bilgileri
                </h3>

                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Paket İçeriği / Açıklama</label>
                        <input type="text" id="paketAciklama" placeholder="Örn: 2 Adet Kıymalı Pide + İçecek" class="w-full bg-slate-50 border border-slate-200 focus:border-blue-600 focus:bg-white focus:outline-none rounded-xl p-3 text-xs font-medium text-slate-800 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Kurye İçin Özel Not</label>
                        <textarea id="kuryeNotu" rows="2" placeholder="Zile basmayın, kapıya bırakın vb." class="w-full bg-slate-50 border border-slate-200 focus:border-blue-600 focus:bg-white focus:outline-none rounded-xl p-3 text-xs font-medium text-slate-800 transition"></textarea>
                    </div>
                </div>
            </div>

            <!-- 4. ÜCRET VE ÖDEME KARTI -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                <h3 class="font-bold text-xs uppercase tracking-wider text-slate-600 flex items-center gap-2 border-b border-slate-100 pb-2.5">
                    <i class="fa-solid fa-coins text-emerald-600"></i> Ücret ve Ödeme
                </h3>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Kurye Ücreti (₺) <span class="text-red-500">*</span></label>
                        <input type="number" id="kuryeUcreti" required placeholder="Örn: 60" class="w-full bg-slate-50 border border-slate-200 focus:border-blue-600 focus:bg-white focus:outline-none rounded-xl p-3 text-xs font-bold text-slate-900 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Sipariş Tutarı (₺)</label>
                        <input type="number" id="siparisTutari" placeholder="Örn: 350" class="w-full bg-slate-50 border border-slate-200 focus:border-blue-600 focus:bg-white focus:outline-none rounded-xl p-3 text-xs font-medium text-slate-800 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Ödeme Şekli</label>
                    <select id="odemeSekli" class="w-full bg-slate-50 border border-slate-200 focus:border-blue-600 focus:bg-white focus:outline-none rounded-xl p-3 text-xs font-medium text-slate-800 transition">
                        <option value="Online / Ödendi">Online / Ödendi</option>
                        <option value="Nakit (Kapıda)">Nakit (Kapıda Alınacak)</option>
                        <option value="Pos / Kart (Kapıda)">POS / Kart (Kapıda Alınacak)</option>
                    </select>
                </div>
            </div>

            <!-- SUBMIT BUTTON -->
            <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-3.5 rounded-xl text-xs transition shadow-md shadow-blue-200 flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> Paketi Oluştur
            </button>

        </form>

    </main>

    <!-- ALT MENÜ -->
    <nav class="bg-white border-t border-slate-200 fixed bottom-0 left-0 right-0 z-40 shadow-lg">
        <div class="max-w-md mx-auto flex justify-around py-2">
            <button onclick="goPage('isletme.html')" class="flex flex-col items-center text-slate-400 hover:text-blue-600 transition">
                <i class="fa-solid fa-house text-base"></i>
                <span class="text-[10px] font-medium mt-0.5">Ana Sayfa</span>
            </button>
            <button onclick="goPage('paket-ekle.html')" class="flex flex-col items-center text-blue-600">
                <i class="fa-solid fa-square-plus text-base"></i>
                <span class="text-[10px] font-medium mt-0.5">Paket Oluştur</span>
            </button>
            <button onclick="goPage('paketler.html')" class="flex flex-col items-center text-slate-400 hover:text-blue-600 transition">
                <i class="fa-solid fa-boxes-stacked text-base"></i>
                <span class="text-[10px] font-medium mt-0.5">Paketler</span>
            </button>
            <button onclick="goPage('isletme.html')" class="flex flex-col items-center text-slate-400 hover:text-blue-600 transition">
                <i class="fa-solid fa-store text-base"></i>
                <span class="text-[10px] font-medium mt-0.5">İşletme</span>
            </button>
        </div>
    </nav>
    <!-- SCRIPTS -->
    <script type="module">
        import {
            auth,
            db,
            onAuthStateChanged,
            doc,
            getDoc,
            collection,
            addDoc,
            serverTimestamp
        } from "./firebase.js";

        const isletmeAdiEl = document.getElementById("isletmeAdi");
        const isletmeAdresiEl = document.getElementById("isletmeAdresi");
        const isletmeDurumEl = document.getElementById("isletmeDurum");
        const btnSubmit = document.getElementById("btnSubmit");

        let currentUserId = null;
        let currentUserData = null;

        // AUTH KONTROL
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            currentUserId = user.uid;
            await isletmeBilgisiCek(user.uid);
        });

        // İŞLETME BİLGİLERİNİ YÜKLE
        async function isletmeBilgisiCek(uid) {
            try {
                const snap = await getDoc(doc(db, "kullanicilar", uid));
                if (snap.exists()) {
                    currentUserData = snap.data();
                    isletmeAdiEl.textContent = currentUserData.isletmeAdi || "İşletme Adı Belirtilmemiş";
                    isletmeAdresiEl.textContent = currentUserData.adres || "Adres bilgisi eksik";
                    isletmeDurumEl.textContent = "Hazır";
                    isletmeDurumEl.className = "text-[10px] font-bold bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded-md";
                } else {
                    showToast("İşletme kaydı bulunamadı!", "error");
                }
            } catch (err) {
                console.error("Bilgi çekme hatası:", err);
                showToast("Bilgiler yüklenirken hata oluştu.", "error");
            }
        }

        // PAKETİ KAYDET
        window.paketKaydet = async (e) => {
            e.preventDefault();

            if (!currentUserId || !currentUserData) {
                showToast("İşletme doğrulanamadı!", "error");
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Kaydediliyor...`;

            try {
                const paketData = {
                    isletmeId: currentUserId,
                    isletmeAdi: currentUserData.isletmeAdi || "",
                    isletmeTelefon: currentUserData.telefon || currentUserData.tel || "",
                    alisAdresi: currentUserData.adres || "",
                    
                    musteriAdSoyad: document.getElementById("musteriAd").value.trim(),
                    musteriTelefon: document.getElementById("musteriTel").value.trim(),
                    teslimatAdresi: document.getElementById("musteriAdres").value.trim(),
                    
                    paketAciklama: document.getElementById("paketAciklama").value.trim(),
                    kuryeNotu: document.getElementById("kuryeNotu").value.trim(),
                    
                    kuryeUcreti: Number(document.getElementById("kuryeUcreti").value) || 0,
                    siparisTutari: Number(document.getElementById("siparisTutari").value) || 0,
                    odemeSekli: document.getElementById("odemeSekli").value,
                    
                    durum: "bekliyor",
                    olusturmaTarihi: serverTimestamp()
                };

                await addDoc(collection(db, "paketler"), paketData);
                showToast("Paket başarıyla oluşturuldu! 📦", "success");

                setTimeout(() => {
                    window.location.href = "paketler.html";
                }, 1200);

            } catch (error) {
                console.error("Paket ekleme hatası:", error);
                showToast("Paket oluşturulurken bir hata oluştu.", "error");
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Paketi Oluştur`;
            }
        };

        // PROFESYONEL TOAST BİLDİRİM
        function showToast(message, type = "success") {
            const toast = document.getElementById("toast");
            const toastContent = document.getElementById("toastContent");
            const toastIcon = document.getElementById("toastIcon");
            const toastMessage = document.getElementById("toastMessage");

            toastMessage.textContent = message;

            if (type === "success") {
                toastContent.className = "flex items-center gap-3 p-4 rounded-2xl shadow-xl border border-emerald-200 bg-emerald-50 text-emerald-800 text-sm font-semibold";
                toastIcon.className = "fa-solid fa-circle-check text-emerald-600 text-lg";
            } else {
                toastContent.className = "flex items-center gap-3 p-4 rounded-2xl shadow-xl border border-red-200 bg-red-50 text-red-800 text-sm font-semibold";
                toastIcon.className = "fa-solid fa-circle-xmark text-red-600 text-lg";
            }

            toast.classList.remove("-translate-y-20", "opacity-0", "pointer-events-none");
            toast.classList.add("translate-y-0", "opacity-100");

            setTimeout(() => {
                toast.classList.remove("translate-y-0", "opacity-100");
                toast.classList.add("-translate-y-20", "opacity-0", "pointer-events-none");
            }, 3000);
        }

        window.goBack = () => history.back();
        window.goPage = (url) => window.location.href = url;
    </script>
</body>
</html>
